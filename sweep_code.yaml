program: python3  
method: grid
metric:
  name: train_loss
  goal: minimize
parameters:
  base_model:
    values: 
      - allenai/OLMo-2-0425-1B
      # - meta-llama/Llama-3.2-1B
      # - Qwen/Qwen2.5-0.5B
  train_dataset:
    values:
      - allenai/tulu-3-sft-personas-code
  train_split:
    value: train

  learning_rate:
    values: [1e-4]
  seed:
    values: [42]
  lora_r:
    value: 8
  num_train_epochs:
    value: 3
  per_device_train_batch_size:
    value: 8
  gradient_accumulation_steps:
    value: 4
  logging_steps:
    value: 50
  save_total_limit:
    value: 2
  bf16:
    value: true
  report_to:
    value: wandb

command:
- ${env}
- ${program}
- -m
- accelerate.commands.launch
- finetune.py
- ${args}